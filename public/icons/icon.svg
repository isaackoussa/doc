<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Lumen : un livre ouvert (lire) dont la page de droite devient une onde sonore (écouter) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0703A"/>
      <stop offset="1" stop-color="#B83A0B"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FDEFE4"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <!-- étincelle : « comprendre » -->
  <path d="M392 92 l9 22 22 9 -22 9 -9 22 -9 -22 -22 -9 22 -9z" fill="#FFE2C7"/>
  <!-- livre -->
  <path d="M86 168 C146 146 210 152 252 186 L252 392 C210 360 146 354 86 374 Z" fill="url(#page)"/>
  <path d="M426 168 C366 146 302 152 260 186 L260 392 C302 360 366 354 426 374 Z" fill="url(#page)"/>
  <path d="M252 186 L260 186 L260 392 L252 392 Z" fill="#E9C9B3"/>
  <!-- lignes de texte (page de gauche) -->
  <g stroke="#E0865A" stroke-width="13" stroke-linecap="round" fill="none">
    <path d="M122 214 C160 204 196 207 222 220"/>
    <path d="M122 254 C160 244 196 247 222 260"/>
    <path d="M122 294 C160 284 196 287 222 300"/>
    <path d="M122 334 C152 326 176 327 196 334"/>
  </g>
  <!-- onde sonore (page de droite) -->
  <g stroke="#C2410C" stroke-width="16" stroke-linecap="round">
    <path d="M300 262 v24"/>
    <path d="M330 236 v76"/>
    <path d="M360 214 v120"/>
    <path d="M390 244 v60"/>
  </g>
</svg>
